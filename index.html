nt(180deg,#7393ff,#3563e9);display:flex;align-items:start;justify-content:center;color:white;font-size:12px;font-weight:700;padding-top:8px;transition:height .25s,background .2s}.bar.compare{background:linear-gradient(180deg,#fbba55,#f59e0b)}.bar.sorted{background:linear-gradient(180deg,#4ade80,#16a34a)}.stepbox{background:#f8faff;border-radius:14px;padding:15px;line-height:1.7;font-size:13px;min-height:85px}.question{padding:16px 0;border-bottom:1px solid var(--line)}.question:last-child{border:0}.question p{font-size:14px;font-weight:600}.option{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;font-size:13px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:var(--pale)}.option input{margin-right:8px}.notice{padding:13px 15px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px;line-height:1.7}.success{padding:13px 15px;border-radius:12px;background:#dcfce7;color:#166534;font-size:12px;line-height:1.7}.loginwrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:25px}.loginbox{width:min(460px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 60px #1e3a8a12}.loginbox h1{font-size:24px;margin:12px 0 6px}.loginbox>p{font-size:13px;color:var(--muted);line-height:1.7}.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.rolepick button{background:white;color:var(--ink);border:1px solid var(--line)}.rolepick button.selected{border-color:var(--blue);background:var(--pale);color:var(--blue)}.toast{position:fixed;bottom:20px;right:20px;background:#172554;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 10px 30px #0002;z-index:20;font-size:13px;max-width:360px}.empty{text-align:center;padding:30px;color:var(--muted)}.progress{height:8px;background:#e9eef8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);border-radius:99px}.footnote{font- <script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const modules=[
{title:"Pengenalan Algoritma Pengurutan",desc:"Memahami sorting, ascending, descending, dan contoh penggunaannya.",time:"10 menit",icon:"🧭",body:`<p>Algoritma pengurutan (sorting) adalah langkah-langkah sistematis untuk menyusun data berdasarkan aturan tertentu. Data dapat diurutkan dari nilai terkecil ke terbesar (ascending) atau dari terbesar ke terkecil (descending).</p><p>Contoh ascending: <b>7, 2, 5, 1 → 1, 2, 5, 7</b>. Contoh descending: <b>7, 2, 5, 1 → 7, 5, 2, 1</b>.</p><p>Sorting berguna saat menyusun nilai, harga barang, daftar nama, atau data lain agar lebih mudah dibaca dan dianalisis.</p>`},
{title:"Bubble Sort",desc:"Membandingkan elemen bersebelahan dan menukarnya bila perlu.",time:"15 menit",icon:"🫧",body:`<p>Bubble Sort membandingkan dua elemen yang bersebelahan. Untuk ascending, jika elemen kiri lebih besar daripada elemen kanan, kedua elemen ditukar. Proses berulang sampai data terurut.</p><p><b>Contoh:</b> data 5, 2, 4, 1.</p><ol><li>Bandingkan 5 dan 2 → tukar: 2, 5, 4, 1.</li><li>Bandingkan 5 dan 4 → tukar: 2, 4, 5, 1.</li><li>Bandingkan 5 dan 1 → tukar: 2, 4, 1, 5.</li><li>Lanjutkan proses pada bagian yang belum terurut hingga menjadi 1, 2, 4, 5.</li></ol><p>Ingat: Bubble Sort menekankan perbandingan elemen bersebelahan.</p>`},
{title:"Selection Sort",desc:"Memilih elemen terkecil dari bagian yang belum terurut.",time:"15 menit",icon:"🎯",body:`<p>Selection Sort mencari elemen terkecil pada bagian data yang belum terurut, lalu menempatkannya pada posisi pertama dari bagian tersebut. Proses diulang untuk posisi berikutnya.</p><p><b>Contoh:</b> 5, 3, 4, 1. Nilai terkecil adalah 1, sehingga ditukar dengan elemen pertama menjadi 1, 3, 4, 5. Pada data ini, bagian sisanya sudah terurut.</p><p>Fokus Selection Sort adalah memilih elemen yang tepat untuk posisi berikutnya.</p>`},
{title:"Insertion Sort",desc:"Menyisipkan elemen pada posisi tepat di bagian yang sudah terurut.",time:"15 menit",icon:"🧩",body:`<p>Insertion Sort mengambil satu elemen, lalu menyisipkannya pada posisi yang tepat dalam bagian data di sebelah kiri yang sudah terurut.</p><p><b>Contoh:</b> 5, 2, 4, 1.</p><ol><li>Anggap 5 sudah terurut.</li><li>Ambil 2, sisipkan sebelum 5 → 2, 5, 4, 1.</li><li>Ambil 4, sisipkan di antara 2 dan 5 → 2, 4, 5, 1.</li><li>Ambil 1, sisipkan di awal → 1, 2, 4, 5.</li></ol><p>Fokus Insertion Sort adalah menyisipkan elemen ke bagian yang telah terurut.</p>`},
{title:"Membandingkan Algoritma",desc:"Mengenali ciri utama Bubble, Selection, dan Insertion Sort.",time:"8 menit",icon:"⚖️",body:`<p><b>Bubble Sort:</b> membandingkan elemen bersebelahan dan menukar jika urutannya salah.</p><p><b>Selection Sort:</b> mencari elemen terkecil dari bagian yang belum terurut.</p><p><b>Insertion Sort:</b> menyisipkan elemen ke posisi yang benar dalam bagian yang telah terurut.</p><p>Tidak ada satu algoritma yang selalu paling tepat untuk semua keadaan. Pemilihan algoritma bergantung pada konteks dan kebutuhan.</p>`},
{title:"Kesalahan Umum",desc:"Mengenali dan memperbaiki kesalahan saat menelusuri langkah sorting.",time:"7 menit",icon:"🔎",body:`<p>Kesalahan umum meliputi tertukar antara ascending dan descending, melewatkan perbandingan, melakukan pertukaran yang tidak diperlukan, serta menuliskan hasil akhir tanpa mampu menjelaskan proses.</p><p>Untuk menghindarinya, tuliskan keadaan data setelah setiap langkah dan periksa kembali aturan algoritma yang digunakan.</p>`}
];
const questions=[
{q:"Apa yang dimaksud dengan algoritma sorting?",opts:["Menghapus seluruh data","Menyusun data berdasarkan aturan tertentu","Mengacak data","Menggandakan data"],a:1,why:"Sorting menyusun data berdasarkan urutan yang ditentukan."},
{q:"Hasil ascending dari 7, 2, 5, 1 adalah …",opts:["7, 5, 2, 1","1, 2, 5, 7","2, 1, 5, 7","1, 5, 2, 7"],a:1,why:"Ascending berarti dari nilai terkecil ke terbesar."},
{q:"Dalam Bubble Sort ascending, jika pasangan bersebelahan adalah 6 dan 3, apa yang dilakukan?",opts:["Tidak melakukan apa-apa","Hapus angka 6","Tukar menjadi 3 dan 6","Tukar menjadi 6 dan 3"],a:2,why:"Angka kiri lebih besar daripada angka kanan, jadi keduanya ditukar."},
{q:"Apa yang dicari Selection Sort pada setiap tahap?",opts:["Elemen terkecil pada bagian yang belum terurut","Elemen terbesar saja","Elemen yang sama","Jumlah seluruh elemen"],a:0,why:"Selection Sort memilih elemen terkecil untuk posisi berikutnya pada ascending."},
{q:"Bagaimana cara utama Insertion Sort bekerja?",opts:["Mengacak semua elemen","Menyisipkan elemen pada posisi tepat di bagian yang telah terurut","Menghapus elemen pertama","Membandingkan hanya elemen terakhir"],a:1,why:"Insertion Sort menyisipkan elemen ke bagian yang telah terurut."},
{q:"Hasil descending dari 3, 8, 1, 5 adalah …",opts:["1, 3, 5, 8","3, 1, 5, 8","8, 5, 3, 1","8, 3, 5, 1"],a:2,why:"Descending berarti dari terbesar ke terkecil."},
{q:"Pada Bubble Sort, elemen yang dibandingkan adalah …",opts:["Elemen pertama dan terakhir saja","Elemen bersebelahan","Semua elemen sekaligus","Hanya elemen genap"],a:1,why:"Bubble Sort membandingkan elemen yang saling bersebelahan."},
{q:"Data awal 4, 2, 3, 1. Setelah Bubble Sort membandingkan pasangan pertama pada ascending, data menjadi …",opts:["2, 4, 3, 1","4, 3, 2, 1","1, 2, 3, 4","4, 2, 1, 3"],a:0,why:"Pasangan pertama 4 dan 2 ditukar menjadi 2 dan 4."},
{q:"Apa tujuan utama pengurutan data?",opts:["Membuat data lebih sulit dibaca","Menyusun data sesuai aturan agar lebih teratur","Menghilangkan informasi","Mengganti semua nilai"],a:1,why:"Data terurut lebih mudah dibaca dan dianalisis."},
{q:"Apakah hasil akhir yang benar selalu membuktikan siswa memahami algoritma?",opts:["Ya, selalu","Tidak; proses dan alasan juga perlu diperiksa","Ya, jika cepat","Tidak ada jawaban benar"],a:1,why:"Pemahaman proses perlu diperiksa selain jawaban akhir."}
];

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function go(page){currentPage=page;$("#sidebar").classList.remove("open");$$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#crumb").textContent="AlgoLab / "+({home:"Beranda",materials:"Materi Pembelajaran",simulator:"Simulasi Sorting",practice:"Latihan & Kuis",assignments:"Tugas & LKPD",results:"Hasil Belajar",login:"Login"}[page]||page);render(page)}
function render(page){let app=$("#app");if(page==="home")app.innerHTML=home();if(page==="materials")app.innerHTML=materials();if(page==="simulator")app.innerHTML=simulator();if(page==="practice")app.innerHTML=practice();if(page==="assignments")app.innerHTML=assignments();if(page==="results")app.innerHTML=results();if(page==="login")app.innerHTML=login();bindPage()}
function home(){return `<section class="hero"><div><div class="eyebrow">INFORMATIKA KELAS X · PEMBELAJARAN INTERAKTIF</div><h1>Pahami Algoritma,<br>Praktikkan Langkahnya.</h1><p>Selamat datang di AlgoLab, laboratorium algoritma interaktif. Pelajari sorting melalui materi ringkas, simulasi visual, latihan bertahap, dan asesmen untuk memeriksa pemahamanmu.</p><div class="heroactions"><button data-goto="materials">Mulai Belajar →</button><button class="secondary" data-goto="simulator">Coba Simulasi</button></div></div><div class="heroart">⌘<br><span style="font-size:22px;font-weight:700">ALGO<br>LAB</span></div></section>
<div class="stats"><div class="stat"><small>Modul tersedia</small><strong>06</strong><span class="pill">Materi inti</span></div><div class="stat"><small>Soal asesmen</small><strong>10</strong><span class="pill">Kuis awal</span></div><div class="stat"><small>Simulasi</small><strong>03</strong><span class="pill">Algoritma sorting</span></div><div class="stat"><small>Status akun</small><strong style="font-size:19px">${user?user.role==="guru"?"Guru":"Siswa":"Publik"}</strong><span class="pill">${user?"Sudah login":"Belum login"}</span></div></div>
<div class="sectionhead"><div><h2>Jelajahi pembelajaran</h2><p>Pilih aktivitas untuk mulai memahami algoritma.</p></div></div><div class="grid"><div class="card"><div class="iconbox">📘</div><h3>Materi Terstruktur</h3><p>Pelajari konsep sorting melalui penjelasan singkat, contoh, dan ringkasan setiap modul.</p><button class="secondary" data-goto="materials">Buka materi</button></div><div class="card"><div class="iconbox">📊</div><h3>Simulasi Visual</h3><p>Amati proses membandingkan, menukar, dan menyisipkan elemen langkah demi langkah.</p><button class="secondary" data-goto="simulator">Buka simulasi</button></div><div class="card"><div class="iconbox">📝</div><h3>Latihan & Asesmen</h3><p>Uji pemahaman dan lihat pembahasan jawaban setelah menyelesaikan kuis.</p><button class="secondary" data-goto="practice">Mulai kuis</button></div></div>
<div class="panel"><div class="row between"><div><h2 style="margin-bottom:5px">Alur belajar yang disarankan</h2><p class="muted small">Ikuti langkah ini agar memahami proses, bukan hanya hasil akhir.</p></div><span class="pill">4 langkah</span></div><div class="grid"><div><b>01 · Pahami</b><p class="small muted">Baca konsep dan tujuan modul.</p></div><div><b>02 · Amati</b><p class="small muted">Ikuti simulasi setiap langkah.</p></div><div><b>03 · Praktikkan</b><p class="small muted">Kerjakan LKPD atau latihan mandiri.</p></div><div><b>04 · Refleksikan</b><p class="small muted">Periksa kesalahan dan pahami alasannya.</p></div></div></div><p class="footnote">AlgoLab · Media pembelajaran Informatika. Materi dan asesmen dapat disesuaikan dengan pembelajaran di kelas.</p>`}
function materials(){return `<div class="sectionhead"><div><h2>Materi Pembelajaran</h2><p>Materi algoritma pengurutan disusun dari konsep dasar hingga evaluasi.</p></div></div><div class="modulelist">${modules.map((m,i)=>`<div class="module"><div class="num">${String(i+1).padStart(2,"0")}</div><div style="flex:1"><div class="row between"><h3>${m.icon} ${m.title}</h3><span class="tag">${m.time}</span></div><p>${m.desc}</p><div style="margin-top:12px"><button class="secondary" data-module="${i}">Pelajari modul →</button></div></div></div>`).join("")}</div><div id="moduleDetail"></div>`}
function simulator(){return `<div class="sectionhead"><div><h2>Simulasi Algoritma Sorting</h2><p>Masukkan data, pilih algoritma, lalu amati proses setiap langkah.</p></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Algoritma</label><select id="algo"><option value="bubble">Bubble Sort</option><option value="selection">Selection Sort</option><option value="insertion">Insertion Sort</option></select></div><div class="field"><label>Urutan</label><select id="order"><option value="asc">Ascending (kecil ke besar)</option><option value="desc">Descending (besar ke kecil)</option></select></div><div class="field" style="grid-column:1/-1"><label>Data angka (pisahkan dengan koma)</label><input id="simInput" value="${sim.arr.join(", ")}" placeholder="Contoh: 5, 2, 4, 1"></div></div><div class="row"><button id="startSim">Buat simulasi</button><button class="secondary" id="randomSim">Data acak</button><button class="secondary" id="prevStep">← Sebelumnya</button><button class="secondary" id="nextStep">Langkah berikutnya →</button><button class="ghost" id="resetSim">Reset</button></div></div><div class="algorithm-area"><div class="panel"><div class="row between"><h3>Visualisasi data</h3><span class="pill" id="stepCount">Langkah 1</span></div><div class="bars" id="bars"></div><div class="progress" style="margin-top:14px"><span id="simProgress" style="width:0%"></span></div><p class="small muted">Warna oranye menandai elemen yang sedang diproses, hijau menandai posisi yang telah dipastikan.</p></div><div class="panel"><h3>Penjelasan langkah</h3><div class="stepbox" id="stepText"></div><div style="margin-top:16px"><b>Hasil akhir</b><div id="finalData" class="muted" style="margin-top:8px">Selesaikan simulasi untuk melihat hasil.</div></div><div style="margin-top:18px"><b>Konsep yang perlu diingat</b><p id="algoHint" class="small muted">Pilih algoritma dan mulai simulasi.</p></div></div></div><div class="panel"><h3>Riwayat langkah</h3><div class="tablewrap"><table><thead><tr><th>Langkah</th><th>Aktivitas</th><th>Keadaan data</th></tr></thead><tbody id="history"></tbody></table></div></div>`}
function buildSteps(arr,algo,order){let a=[...arr],steps=[{arr:[...a],i:-1,j:-1,desc:"Data awal: "+a.join(", ")}],cmp=(x,y)=>order==="asc"?x>y:x<y;
if(algo==="bubble"){for(let end=a.length-1;end>0;end--){let swapped=false;for(let j=0;j<end;j++){steps.push({arr:[...a],i:j,j:j+1,desc:`Bandingkan ${a[j]} dan ${a[j+1]}.`});if(cmp(a[j],a[j+1])){[a[j],a[j+1]]=[a[j+1],a[j]];swapped=true;steps.push({arr:[...a],i:j,j:j+1,desc:`Urutan belum sesuai, tukar menjadi ${a.join(", ")}.`})}else steps.push({arr:[...a],i:j,j:j+1,desc:"Urutan pasangan ini sudah sesuai, tidak perlu ditukar."})}if(!swapped)break} }
if(algo==="selection"){for(let i=0;i<a.length-1;i++){let best=i;for(let j=i+1;j<a.length;j++){steps.push({arr:[...a],i:best,j,desc:`Bandingkan kandidat ${a[best]} dengan ${a[j]} untuk mencari nilai ${order==="asc"?"terkecil":"terbesar"}.`});if(cmp(a[best],a[j]))best=j}if(best!==i){[a[i],a[best]]=[a[best],a[i]];steps.push({arr:[...a],i,j:best,desc:`Tempatkan elemen pilihan pada posisi ${i+1}: ${a.join(", ")}.`})}else steps.push({arr:[...a],i,j:i,desc:`Elemen pada posisi ${i+1} sudah tepat.`})}}
if(algo==="insertion"){for(let i=1;i<a.length;i++){let key=a[i],j=i-1;steps.push({arr:[...a],i,j,desc:`Ambil nilai ${key} untuk disisipkan pada bagian kiri yang sudah terurut.`});while(j>=0&&cmp(a[j],key)){a[j+1]=a[j];steps.push({arr:[...a],i:j,j:j+1,desc:`Geser ${a[j]} satu posisi ke kanan.`});j--}a[j+1]=key;steps.push({arr:[...a],i:j+1,j:i,desc:`Sisipkan ${key}. Data sekarang: ${a.join(", ")}.`})}}
steps.push({arr:[...a],i:-1,j:-1,desc:"Selesai. Data terurut: "+a.join(", ")});return steps}
function initSim(){let raw=$("#simInput").value.split(",").map(x=>x.trim()).filter(Boolean);if(raw.length<1||raw.length>12||raw.some(x=>!Number.isFinite(Number(x)))){toast("Masukkan 1–12 angka yang valid.");return}sim.arr=raw.map(Number);sim.algo=$("#algo").value;sim.order=$("#order").value;sim.steps=buildSteps(sim.arr,sim.algo,sim.order);sim.idx=0;drawSim()}
function drawSim(){if(!sim.steps.length)sim.steps=buildSteps(sim.arr,sim.algo,sim.order);let s=sim.steps[sim.idx];$("#bars").innerHTML=s.arr.map((n,i)=>`<div class="barwrap"><div class="bar ${i===s.i||i===s.j?"compare":""} ${sim.idx===sim.steps.length-1?"sorted":""}" style="height:${Math.max(35,Math.min(170,Math.abs(n)*8+30))}px">${n}</div><span class="small muted">${i+1}</span></div>`).join("");$("#stepText").textContent=s.desc;$("#stepCount").textContent=`Langkah ${sim.idx+1} / ${sim.steps.length}`;$("#simProgress").style.width=((sim.idx+1)/sim.steps.length*100)+"%";$("#finalData").textContent=sim.idx===sim.steps.length-1?s.arr.join(", "):"Belum selesai";$("#algoHint").textContent=({bubble:"Bandingkan elemen bersebelahan dan tukar jika urutannya salah.",selection:"Pilih elemen terkecil/terbesar dari bagian yang belum terurut.",insertion:"Sisipkan elemen ke posisi tepat pada bagian yang sudah terurut."})[sim.algo];$("#history").innerHTML=sim.steps.slice(0,sim.idx+1).slice(-12).map((st,k,arr)=>`<tr><td>${Math.max(0,sim.idx-11)+k+1}</td><td>${esc(st.desc)}</td><td>${st.arr.join(", ")}</td></tr>`).join("")}
function practice(){return `<div class="sectionhead"><div><h2>Latihan & Kuis</h2><p>Jawab pertanyaan secara mandiri. Pembahasan tampil setelah jawaban dikirim.</p></div><span class="pill">10 soal</span></div><div class="notice">Untuk pengukuran pembelajaran, siswa sebaiknya mengerjakan kuis secara individu sebelum berdiskusi. Hasil kuis pada versi demo ini tersimpan di browser yang sedang digunakan.</div><form id="quizForm" class="panel">${questions.map((q,i)=>`<div class="question"><p>${i+1}. ${q.q}</p>${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" required>${o}</label>`).join("")}<div id="feedback${i}" class="small hidden"></div></div>`).join("")}<div style="margin-top:18px"><button type="submit">Kirim jawaban</button></div><div id="quizResult" style="margin-top:16px"></div></form>`}
function assignments(){let mine=user?submissions.filter(s=>user.role==="guru"||s.student===user.name):submissions;return `<div class="sectionhead"><div><h2>Tugas & LKPD Digital</h2><p>Kerjakan LKPD sorting, tulis proses, dan kirim hasil pekerjaan.</p></div></div>${user?.role==="guru"?`<div class="panel"><h3>Buat instruksi tugas</h3><div class="field"><label>Judul tugas</label><input id="taskTitle" value="LKPD: Menelusuri Langkah Bubble Sort"></div><div class="field"><label>Instruksi</label><textarea id="taskDesc">Urutkan data 5, 2, 4, 1 menggunakan Bubble Sort. Catat setiap perbandingan, pertukaran, dan keadaan data setelah langkah tersebut. Tuliskan kesimpulan.</textarea></div><button id="createTask">Simpan instruksi tugas</button><p class="small muted">Pada versi demo, instruksi tersimpan di browser ini.</p></div>`:""}<div class="panel"><div class="row between"><div><h3>LKPD: Menelusuri Langkah Bubble Sort</h3><p class="small muted">Tugas individu · Materi algoritma pengurutan</p></div><span class="pill">Perkiraan 15 menit</span></div><p>Data awal: <b>5, 2, 4, 1</b>. Gunakan simulasi untuk membantu memahami proses, tetapi tuliskan jawaban dengan kata-katamu sendiri.</p><div class="field"><label>Nama siswa</label><input id="studentName" value="${esc(user?.role==="siswa"?user.name:"")}" placeholder="Masukkan nama lengkap"></div><div class="field"><label>1. Tuliskan data setelah perbandingan pertama.</label><input id="answer1" placeholder="Contoh: 2, 5, 4, 1"></div><div class="field"><label>2. Jelaskan kapan elemen ditukar dalam Bubble Sort ascending.</label><textarea id="answer2" placeholder="Tuliskan penjelasanmu..."></textarea></div><div class="field"><label>3. Tuliskan hasil akhir pengurutan.</label><input id="answer3" placeholder="Urutan akhir"></div><div class="field"><label>4. Refleksi: bagian mana yang paling sulit dipahami?</label><textarea id="answer4" placeholder="Tuliskan refleksimu..."></textarea></div><div class="field"><label>Lampiran (opsional, demo hanya menyimpan nama file)</label><input id="fileUpload" type="file" accept=".pdf,.doc,.docx,.txt,.png,.jpg"></div><button id="submitAssignment">Kumpulkan LKPD</button><div class="small muted" style="margin-top:10px">Catatan: versi demo menyimpan teks dan metadata nama file di browser, bukan mengunggah file ke server.</div></div><div class="panel"><h3>${user?.role==="guru"?"Pengumpulan siswa":"Riwayat pengumpulan saya"}</h3>${mine.length?`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>Waktu</th><th>Jawaban akhir</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${mine.map((s,i)=>`<tr><td>${esc(s.student)}</td><td>${esc(s.date)}</td><td>${esc(s.a3)}</td><td><span class="tag ${s.grade!=null?"green":"orange"}">${s.grade!=null?"Sudah dinilai":"Sudah dikumpulkan"}</span></td><td>${user?.role==="guru"?`<button class="secondary" data-grade="${i}">Nilai</button>`:"Lihat"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Belum ada pengumpulan. Setelah siswa mengirim LKPD, hasil akan tampil di sini pada browser ini.</div>`}</div>`}
function results(){let mine=user?attempts.filter(a=>user.role==="guru"||a.student===user.name):attempts;return `<div class="sectionhead"><div><h2>Hasil Belajar</h2><p>Rekap hasil latihan dan pengumpulan yang tersedia pada versi demo.</p></div></div>${!user?`<div class="notice">Login untuk melihat tampilan hasil berdasarkan mode pengguna.</div>`:""}<div class="stats"><div class="stat"><small>Submission LKPD</small><strong>${user?.role==="guru"?submissions.length:submissions.filter(s=>s.student===user?.name).length}</strong></div><div class="stat"><small>Percobaan kuis</small><strong>${mine.length}</strong></div><div class="stat"><small>Rata-rata kuis</small><strong>${mine.length?Math.round(mine.reduce((a,b)=>a+b.score,0)/mine.length)+"%":"—"}</strong></div><div class="stat"><small>Perlu dinilai</small><strong>${submissions.filter(s=>s.grade==null).length}</strong></div></div><div class="panel"><div class="row between"><h3>Riwayat kuis</h3><button class="secondary" id="exportCsv">Ekspor CSV</button></div>${mine.length?`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>Tanggal</th><th>Skor</th><th>Benar</th></tr></thead><tbody>${mine.map(a=>`<tr><td>${esc(a.student)}</td><td>${esc(a.date)}</td><td>${a.score}%</td><td>${a.correct}/${a.total}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Belum ada hasil kuis.</div>`}</div><div class="notice" style="margin-top:18px">Data pada versi website demo ini tersimpan di browser yang sama. Untuk penggunaan lintas perangkat dan pengumpulan resmi, integrasikan autentikasi, database, dan penyimpanan file Supabase.</div>`}
function login(){return `<div class="loginwrap"><div class="loginbox"><div class="logo">A</div><h1>Masuk ke AlgoLab</h1><p>Pilih mode pengguna dan isi nama untuk mencoba prototipe. Login ini hanya simulasi antarmuka, belum autentikasi online.</p><div class="rolepick"><button id="pickStudent" class="${!user||user.role==="siswa"?"selected":""}">🎓 Mode Siswa</button><button id="pickTeacher" class="${user?.role==="guru"?"selected":""}">👩‍🏫 Mode Guru</button></div><div class="field"><label>Nama tampilan</label><input id="loginName" placeholder="Contoh: Siti Rahma" value="${esc(user?.name||"")}"></div><div class="field"><label>Email (demo)</label><input id="loginEmail" type="email" placeholder="nama@sekolah.sch.id"></div><div class="field"><label>Password (demo)</label><input id="loginPassword" type="password" placeholder="Isi apa saja untuk demo"></div><button id="loginSubmit" style="width:100%">Masuk ke dashboard</button><p class="small muted">Jangan gunakan password asli. Login demo tidak memverifikasi identitas.</p></div></div>`}
let loginRole="siswa";
function bindPage(){
$$("[data-goto]").forEach(b=>b.onclick=()=>go(b.dataset.goto));
$$("[data-module]").forEach(b=>b.onclick=()=>{let i=+b.dataset.module,m=modules[i],d=$("#moduleDetail");d.innerHTML=`<div class="panel"><div class="row between"><h2>${m.icon} ${m.title}</h2><button class="ghost" id="closeModule">Tutup</button></div>${m.body}<button data-goto="simulator">Coba simulasi →</button><button class="secondary" data-goto="practice">Latihan →</button></div>`;d.scrollIntoView({behavior:"smooth",block:"start"});$("#closeModule").onclick=()=>d.innerHTML="";$$("[data-goto]").forEach(x=>x.onclick=()=>go(x.dataset.goto))});
if($("#startSim")){sim.algo=$("#algo").value;drawSim();$("#startSim").onclick=initSim;$("#randomSim").onclick=()=>{$("#simInput").value=Array.from({length:6},()=>Math.floor(Math.random()*9)+1).join(", ");initSim()};$("#nextStep").onclick=()=>{sim.idx=Math.min(sim.idx+1,sim.steps.length-1);drawSim()};$("#prevStep").onclick=()=>{sim.idx=Math.max(0,sim.idx-1);drawSim()};$("#resetSim").onclick=()=>{sim.idx=0;drawSim()}}
if($("#quizForm"))$("#quizForm").onsubmit=e=>{e.preventDefault();let correct=0;questions.forEach((q,i)=>{let v=+new FormData(e.target).get("q"+i),f=$("#feedback"+i);if(v===q.a)correct++;f.classList.remove("hidden");f.style.color=v===q.a?"#15803d":"#dc2626";f.textContent=(v===q.a?"Benar. ":"Belum tepat. ")+q.why});let score=Math.round(correct/questions.length*100);$("#quizResult").innerHTML=`<div class="${score>=70?"success":"notice"}"><b>Skor: ${score}/100 (${correct}/${questions.length} benar)</b><br>${score>=70?"Teruskan belajar dan periksa kembali pembahasan.":"Pelajari kembali modul terkait, lalu coba latihan lagi."}</div>`;attempts.unshift({student:user?.name||"Pengunjung",date:new Date().toLocaleString("id-ID"),score,correct,total:questions.length});saveLocal();toast("Hasil kuis dicatat pada browser ini.");e.target.querySelector("button[type=submit]").disabled=true};
if($("#submitAssignment"))$("#submitAssignment").onclick=()=>{let name=$("#studentName").value.trim()||(user?.name||"");if(!name){toast("Isi nama siswa terlebih dahulu.");return}if(!$("#answer1").value.trim()||!$("#answer2").value.trim()||!$("#answer3").value.trim()){toast("Lengkapi jawaban 1, 2, dan 3.");return}let file=$("#fileUpload").files[0];submissions.unshift({student:name,date:new Date().toLocaleString("id-ID"),a1:$("#answer1").value,a2:$("#answer2").value,a3:$("#answer3").value,a4:$("#answer4").value,file:file?file.name:"",grade:null,feedback:""});saveLocal();toast("LKPD tersimpan pada browser ini. Untuk pengumpulan online, backend perlu diaktifkan.");go("assignments")};
if($("#createTask"))$("#createTask").onclick=()=>toast("Instruksi tugas contoh sudah tersedia. Pembuatan tugas lintas perangkat memerlukan backend Supabase.");
$$("[data-grade]").forEach(b=>b.onclick=()=>{let i=+b.dataset.grade,sub=submissions[i];let val=prompt("Masukkan nilai 0–100 untuk "+sub.student);if(val===null)return;let n=Number(val);if(!Number.isFinite(n)||n<0||n>100){toast("Nilai harus antara 0 dan 100.");return}sub.grade=n;sub.feedback=prompt("Umpan balik guru (opsional):")||"";saveLocal();toast("Nilai disimpan pada browser ini.");go("assignments")});
if($("#exportCsv"))$("#exportCsv").onclick=()=>{let rows=[["Nama","Tanggal","Skor","Benar","Jumlah soal"],...mine.map(a=>[a.student,a.date,a.score,a.correct,a.total])];let csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="rekap-algolab.csv";a.click();URL.revokeObjectURL(url)};
if($("#pickStudent"))$("#pickStudent").onclick=()=>{loginRole="siswa";$("#pickStudent").classList.add("selected");$("#pickTeacher").classList.remove("selected")};if($("#pickTeacher"))$("#pickTeacher").onclick=()=>{loginRole="guru";$("#pickTeacher").classList.add("selected");$("#pickStudent").classList.remove("selected")};
if($("#loginSubmit"))$("#loginSubmit").onclick=()=>{let name=$("#loginName").value.trim();if(!name){toast("Masukkan nama tampilan.");return}setUser({name,role:loginRole});toast("Mode demo aktif. Ini bukan login aman untuk penggunaan publik.");go(loginRole==="guru"?"results":"home")};
}
$("#navigation").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});
$$("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
$("#logoutBtn").onclick=()=>{setUser(null);go("home");toast("Keluar dari mode demo.")};
$("#mobileMenu").onclick=()=>$("#sidebar").classList.toggle("open");
go("home");
</script>
</body></html>
